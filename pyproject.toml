[project]
name = "amr_prediction-service"
version = "0.1.3"
description = "Service for AMR prediction by AA sequence."
requires-python=">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary,pool]",
    "mlflow-skinny>=3.16,<4",
    "skops>=0.16",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=8",
    "dvc[s3]>=3.67.1",
    "pandera>=0.34.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "amr_prediction"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
