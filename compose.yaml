services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/amr_prediction
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:16
    environment:
     POSTGRES_PASSWORD: postgres
     POSTGRES_DB: amr_prediction
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: