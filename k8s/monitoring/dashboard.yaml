# Grafana из kube-prometheus-stack подхватывает ConfigMap с меткой grafana_dashboard: "1" в namespace monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: amr-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  amr.json: |
    {
      "uid": "amr-service",
      "title": "AMR service",
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Версия модели в подах",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"textMode": "value_and_name", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "count by (version) (amr_model_info)", "legendFormat": "{{version}}", "instant": true}]
        },
        {
          "id": 2, "type": "stat", "title": "Запросов к /v1/predict за 5 минут",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum(increase(http_requests_total{handler=\"/v1/predict\"}[5m]))"}]
        },
        {
          "id": 3, "type": "stat", "title": "Рестарты контейнеров сервиса",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 5},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"default\", container=\"api\"})"}]
        },
        {
          "id": 4, "type": "timeseries", "title": "Запросы в секунду",
          "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [{"refId": "A", "expr": "sum by (handler, status) (rate(http_requests_total{handler!=\"/metrics\"}[1m]))", "legendFormat": "{{handler}} {{status}}"}]
        },
        {
          "id": 5, "type": "timeseries", "title": "Задержка /v1/predict",
          "gridPos": {"x": 12, "y": 5, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))", "legendFormat": "p50"},
            {"refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Предсказания по классам, доля",
          "gridPos": {"x": 0, "y": 13, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"refId": "A", "expr": "sum by (antibiotic_class) (rate(amr_predictions_total[5m])) / scalar(sum(rate(amr_predictions_total[5m])))", "legendFormat": "{{antibiotic_class}}"}]
        },
        {
          "id": 7, "type": "bargauge", "title": "Распределение уверенности модели за 15 минут",
          "gridPos": {"x": 12, "y": 13, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "options": {"orientation": "vertical", "displayMode": "basic", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"refId": "A", "expr": "sum by (le) (increase(amr_score_bucket[15m]))", "format": "heatmap", "legendFormat": "{{le}}"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "CPU подов сервиса, доля от requests",
          "gridPos": {"x": 0, "y": 21, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0,
            "custom": {"thresholdsStyle": {"mode": "line"}},
            "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.6}]}}},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\", container=\"api\"}[1m])) / sum by (pod) (kube_pod_container_resource_requests{namespace=\"default\", container=\"api\", resource=\"cpu\"})", "legendFormat": "{{pod}}"},
            {"refId": "B", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\", container=\"api\"}[1m])) / sum(kube_pod_container_resource_requests{namespace=\"default\", container=\"api\", resource=\"cpu\"})", "legendFormat": "среднее, по нему HPA, цель 60%"}
          ]
        },
        {
          "id": 9, "type": "timeseries", "title": "Память подов сервиса",
          "gridPos": {"x": 12, "y": 21, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\", container=\"api\"})", "legendFormat": "{{pod}}"},
            {"refId": "B", "expr": "max(kube_pod_container_resource_requests{namespace=\"default\", container=\"api\", resource=\"memory\"})", "legendFormat": "requests"},
            {"refId": "C", "expr": "max(kube_pod_container_resource_limits{namespace=\"default\", container=\"api\", resource=\"memory\"})", "legendFormat": "limits"}
          ]
        }
      ]
    }