# Prometheus Operator находит сервисы с меткой app: amr_prediction и раз в 15 секунд забирает /metrics с порта http
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: amr-service
  namespace: default
spec:
  selector:
    matchLabels:
      app: amr_prediction
  endpoints:
    - port: http
      path: /metrics
      interval: 15s