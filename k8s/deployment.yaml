apiVersion: apps/v1
kind: Deployment
metadata:
  name: amr-prediction-service
spec:
  # числом подов управляет HPA (2-6), replicas здесь сбрасывал бы его при каждом apply
  selector:
    matchLabels:
      app: amr_prediction
  template:
    metadata:
      labels:
        app: amr_prediction
    spec:
      containers:
        - name: api
          # CI заменяет эту строку образом деплоя ghcr.io/...:sha-<коммит> перед kubectl apply
          image: amr_prediction-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: amr-prediction-config}
            - secretRef: {name: amr-prediction-secrets}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 240Mi}
            limits: {cpu: "1", memory: 512Mi}