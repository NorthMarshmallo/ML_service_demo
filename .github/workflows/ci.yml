name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: amr_prediction}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/amr_prediction
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amr-prediction-service:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amr-prediction-service:sha-${GITHUB_SHA}" >> "$GITHUB_ENV" #ghcr
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with: {cluster_name: ci}
      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ci
      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          [ -n "$DB_PASSWORD" ] || { echo "secret DB_PASSWORD is empty/not set"; exit 1; }
          kubectl create secret generic amr-prediction-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/amr_prediction"
      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s
      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/amr-prediction-service api="$IMAGE"
          kubectl rollout status deploy/amr-prediction-service --timeout=120s
      - name: smoke
        run: |
          kubectl port-forward svc/amr-prediction-service 8080:80 &
          sleep 5
          expected=$(kubectl get configmap amr-prediction-config -o jsonpath='{.data.MODEL_PATH}')
          curl --fail -s localhost:8080/health \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r); assert r['model_path'] == sys.argv[1], r" "$expected"
          curl --fail -s -X POST localhost:8080/v1/predict \
            -H "Content-Type: application/json" -d @good.json; echo
          sleep 2
          kubectl exec deploy/postgres -- psql -U postgres -d amr_prediction \
            -tc "SELECT count(*) FROM predictions" | grep -q 1
          curl --fail -s -X POST localhost:8080/v1/predict \
            -H "Content-Type: application/json" -d @good.json \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert 0 <= r['score'] <= 1, r"
      - name: диагностика
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/amr-prediction-service | tail -20
          kubectl get events --sort-by=.lastTimestamp | tail -20
          kubectl logs deploy/amr-prediction-service --previous --tail=30 || true
          kubectl logs deploy/postgres --previous --tail=30 || kubectl logs deploy/postgres --tail=30 || true
          kubectl describe nodes | grep -A 10 "Allocated resources" || true