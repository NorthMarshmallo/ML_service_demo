# Вход в платформу: один порт 80, маршрут по имени хоста. Имена *.localhost браузер и ОС
# сами отправляют на 127.0.0.1, hosts-файл не нужен. Ingress живёт в namespace своего Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: mlops
spec:
  ingressClassName: traefik
  rules:
    - host: mlflow.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: mlflow, port: {number: 5000}}